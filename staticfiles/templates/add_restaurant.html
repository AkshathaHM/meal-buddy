{% extends 'base.html' %}
{% load static %}

{% block title %}New Restaurant | Meal Buddy{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'add_restaurant.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
{% endblock %}

{% block content %}
    <div class="container">
        <h3>Add New Restaurant</h3>

        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}

            <label>Restaurant Name</label>
            <input type="text" name="name" required placeholder="e.g. The Spice Corner">

            <label>Picture URL</label>
            <input type="text" name="picture" placeholder="https://example.com/image.jpg">

            <label>Cuisine</label>
            <input type="text" name="cuisine" placeholder="e.g. Italian">

            <label>Rating</label>
            <input type="number" name="rating" min="0" max="5" step="0.5" placeholder="e.g. 4.5">

            <div class="form-actions">
                <button type="submit">Add Restaurant</button>
                <a class="cancel-button" href="{% url 'admin_home' %}">Cancel</a>
            </div>
        </form>
    </div>

    <!-- Dark / Light toggle -->
    <button class="toggle-mode"></button>
{% endblock %}

{% block extra_scripts %}
    <script>
        const toggleBtn = document.querySelector('.toggle-mode');
        const setThemeIcon = () => {
            toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        setThemeIcon();

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem(
                'theme',
                document.body.classList.contains('dark-mode') ? 'dark' : 'light'
            );
            setThemeIcon();
        });
    </script>
{% endblock %}
