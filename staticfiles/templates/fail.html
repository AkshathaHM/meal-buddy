{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In Failed | Meal Buddy{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'fail.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
{% endblock %}

{% block content %}
    <div class="error-container">
        <h1>Sign-In Failed</h1>
        <p>Invalid username or password. Please try again.</p>

        <a class="retry-btn" href="{% url 'open_signin' %}">Try Again</a>
    </div>

    <!-- Dark / Light Toggle -->
    <button class="toggle-mode"></button>
{% endblock %}

{% block extra_scripts %}
<script>
    const toggleBtn = document.querySelector('.toggle-mode');
    const setThemeIcon = () => {
        if (!toggleBtn) return;
        toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
    };

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    setThemeIcon();

    if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            setThemeIcon();
        });
    }
</script>
{% endblock %}
