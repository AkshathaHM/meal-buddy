{% extends 'base.html' %}
{% load static %}

{% block title %}Welcome | Meal Buddy{% endblock %}

{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'success.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
{% endblock %}

{% block content %}
    <div class="welcome-container">
        <h1>Welcome, <span>{{ user.username }}</span>!</h1>
        <p>You have successfully signed in.</p>

        <a class="primary-btn" href="/open_add_restaurant">
            Add New Restaurant
        </a>
    </div>

    <!-- Circular dark/light toggle -->
    <button class="toggle-mode"></button>
{% endblock %}

{% block extra_scripts %}
    <script>
        const toggleBtn = document.querySelector('.toggle-mode');
        const setThemeIcon = () => {
            toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        setThemeIcon();

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem(
                'theme',
                document.body.classList.contains('dark-mode') ? 'dark' : 'light'
            );
            setThemeIcon();
        });
    </script>
{% endblock %}
