{% extends 'base.html' %}
{% load static %}
{% block title %}Update Restaurant{% endblock %}
{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'update_restaurant.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
{% endblock %}

{% block content %}

    <div class="update-restaurant-container">
        <h2>Update Restaurant</h2>

        <form class="update-form" action="{% url 'update_restaurant' restaurant.id %}" method="post">
            {% csrf_token %}

            <label>Restaurant Name</label>
            <input type="text" name="name" value="{{ restaurant.name }}" required placeholder="Enter restaurant name">

            <label>Picture URL</label>
            <input type="text" name="picture" value="{{ restaurant.picture }}" required placeholder="Enter picture URL">

            <label>Cuisine</label>
            <input type="text" name="cuisine" value="{{ restaurant.cuisine }}" required placeholder="Enter cuisine type">

            <label>Rating</label>
            <input type="number" name="rating" min="0" max="5" step="0.5"
                   value="{{ restaurant.rating }}" required placeholder="Enter restaurant rating">

            <button type="submit">Update Restaurant</button>
        </form>
    </div>

{% endblock %}

{% block extra_scripts %}
<script>
    const toggleBtn = document.querySelector('.toggle-mode');
    const setThemeIcon = () => { if(toggleBtn) toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀'; };
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    setThemeIcon();
    if(toggleBtn) toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        setThemeIcon();
    });
</script>
{% endblock %}
