<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'customer_menu.css' %}">
    <link rel="stylesheet" href="{% static 'addcard.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
</head>
<body>

<div class="top-right-controls">
    <button class="toggle-mode"></button>
    <a class="top-right-logout" href="{% url 'logout' %}">Logout</a>
</div>

<div class="menu-page">
    <div class="menu-header">
        <h3>Welcome, <span>{{ username }}</span>!</h3>
        <a class="cart-btn" href="{% url 'show_cart' username %}">
            Go to Cart
        </a>
    </div>

    <div class="menu-grid">
        {% for item in itemList %}
        <div class="menu-card">
            <img class="menu-image" src="{{ item.picture }}" alt="{{ item.name }}">
            <div class="menu-content">
                <div class="menu-top-row">
                    <h4>{{ item.name }}</h4>
                    {% if item.vegeterian %}
                        <span class="veg-badge">Veg</span>
                    {% else %}
                        <span class="nonveg-badge">Non-Veg</span>
                    {% endif %}
                </div>
                <p class="menu-description">{{ item.description }}</p>
                <div class="menu-footer">
                    <span class="menu-price">₹ {{ item.price }}</span>
                    <button class="add-btn" data-item-id="{{ item.id }}">Add to Cart</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Notification -->
<div id="toast" class="toast">Added to Cart!</div>

<script>
    // Dark/Light toggle
    const toggleBtn = document.querySelector('.toggle-mode');
    const setThemeIcon = () => {
        toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
    };
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    setThemeIcon();
    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem(
            'theme',
            document.body.classList.contains('dark-mode') ? 'dark' : 'light'
        );
        setThemeIcon();
    });

    // Add to cart notification
    const buttons = document.querySelectorAll('.add-btn');
    const toast = document.getElementById('toast');

    buttons.forEach(btn => {
        btn.addEventListener('click', function(e){
            e.preventDefault(); // prevent navigation
            const itemId = this.dataset.itemId;

            // Here you can make an AJAX request to add item to cart
            fetch(`/add_to_cart_ajax/${itemId}/{{ username }}/`, {
                method: 'GET'
            }).then(response => {
                if(response.ok){
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 2000);
                }
            });
        });
    });
</script>

</body>
</html>
