<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Sign IN</title>
        {% load static %}
    <link rel="stylesheet" href="{% static 'signin.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
</head>
<body>
    

    <form action="{% url 'signin' %}" method="post">
        <h3>Sign In</h3>
        {% csrf_token %}
        <label>Username </label>
        <input id="signin-username" type="text" name="username" placeholder="username">

        <label>Password </label>
        <div class="password-field">
            <input id="signin-password" type="password" name="password" placeholder="password">
            <button type="button" class="toggle-password" data-target="signin-password" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.2 18.2 0 0 1-4.2 5.2"></path>
                    <path d="M6.2 6.2C3.5 8.3 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3.1-.5"></path>
                </svg>
            </button>
        </div>

        <button type="submit">SIGN IN</button>

        <p class="forgot-wrap">
            <a href="{% url 'forgot_password' %}" id="forgot-link">Forgot password?</a>
        </p>

        <p class="auth-switch">
            Create an account?
            <a href="{% url 'open_signup' %}">Sign up</a>
        </p>

        <button class="toggle-mode"></button>

<script>
    // Theme toggle icon
    const toggleBtn = document.querySelector('.toggle-mode');
    const setThemeIcon = () => {
        toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
    };

    // Show/Hide password
    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.target;
            const input = document.getElementById(id);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.classList.toggle('is-visible', isPassword);
            btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
    });

    // Forgot password link: use typed username
    document.getElementById('forgot-link').addEventListener('click', (e) => {
        e.preventDefault();
        const username = document.getElementById('signin-username').value.trim();
        if (username) {
            window.location.href = "{% url 'forgot_password' %}?username=" + encodeURIComponent(username);
        } else {
            window.location.href = "{% url 'forgot_password' %}";
        }
    });

    // Load saved theme
    if(localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    setThemeIcon();

    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');

        // Save preference
        if(document.body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
        } else {
            localStorage.setItem('theme', 'light');
        }
        setThemeIcon();
    });
</script>

    </form>
</body>
</html>
