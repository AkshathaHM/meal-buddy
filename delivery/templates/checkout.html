<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'checkout.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <div class="checkout-container">
        <h1>Checkout</h1>
        <h2>Welcome, <span>{{ username }}</span></h2>

        {% if error %}
            <p class="error-text">{{ error }}</p>
        {% else %}

        <table class="checkout-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for item in cart_items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>₹ {{ item.price }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="checkout-total">
            <h3>Total: ₹ {{ total_price }}</h3>
            <button id="rzp-button">Pay with Razorpay</button>
        </div>

        {% endif %}
    </div>

    <!-- Dark / Light Toggle -->
    <button class="toggle-mode"></button>

    <script>
        const toggleBtn = document.querySelector('.toggle-mode');
        const setThemeIcon = () => {
            toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        setThemeIcon();

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem(
                'theme',
                document.body.classList.contains('dark-mode') ? 'dark' : 'light'
            );
            setThemeIcon();
        });
    </script>

    <!-- Razorpay Script (unchanged) -->
    <script>
        var options = {
            "key": "{{ razorpay_key_id }}",
            "amount": "{{ total_price|floatformat:2|add:'0.00'|floatformat:2 }}00",
            "currency": "INR",
            "name": "Meal Buddy",
            "description": "Order Payment",
            "order_id": "{{ order_id }}",
            "handler": function (response) {
                alert("Payment Successful!");
                window.location.href = "{% url 'orders' username %}";
            },
            "prefill": {
                "name": "{{ username }}",
                "email": "customer@example.com",
                "contact": "9999999999"
            },
            "theme": {
                "color": "#ff6b6b"
            }
        };

        var rzp = new Razorpay(options);
        document.getElementById('rzp-button').onclick = function(e) {
            rzp.open();
            e.preventDefault();
        }
    </script>

</body>
</html>
