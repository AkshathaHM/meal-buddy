{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'forgot_password.css' %}">
</head>
<body>

<div class="card">
    <h3>Reset <span>Password</span></h3>

    <form action="{% url 'forgot_password' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="username" value="{{ username|default:'' }}">

        <label>New Password</label>
        <div class="password-field">
            <input id="new-password" type="password" name="new_password" required placeholder="new password">
            <button type="button" class="toggle-password" data-target="new-password" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.2 18.2 0 0 1-4.2 5.2"></path>
                    <path d="M6.2 6.2C3.5 8.3 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3.1-.5"></path>
                </svg>
            </button>
        </div>

        <label>Confirm Password</label>
        <div class="password-field">
            <input id="confirm-password" type="password" name="confirm_password" required placeholder="confirm password">
            <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.2 18.2 0 0 1-4.2 5.2"></path>
                    <path d="M6.2 6.2C3.5 8.3 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3.1-.5"></path>
                </svg>
            </button>
        </div>

        <button type="submit">Submit</button>
    </form>

    <p class="back-link">
        <a href="{% url 'open_signin' %}">Back to Sign in</a>
    </p>
</div>

{% if error %}
<div id="toast" class="toast show error">{{ error }}</div>
{% elif success %}
<div id="toast" class="toast show success">{{ success }}</div>
{% else %}
<div id="toast" class="toast"></div>
{% endif %}

<script>
    // Show/Hide password
    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.target;
            const input = document.getElementById(id);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.classList.toggle('is-visible', isPassword);
            btn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
    });

    // Auto-hide toast, then go to signin on success
    const toast = document.getElementById('toast');
    if (toast && toast.classList.contains('show')) {
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    {% if success %}
    setTimeout(() => {
        window.location.href = "{% url 'open_signin' %}";
    }, 1200);
    {% endif %}
</script>

</body>
</html>
