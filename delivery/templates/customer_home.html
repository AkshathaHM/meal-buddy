<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'customer_home.css' %}">
    <link rel="stylesheet" href="{% static 'theme_toggle.css' %}">
</head>
<body>

    <div class="customer-container">
        <h3>Welcome, <span>{{ username }}</span>!</h3>

        <table class="restaurant-table">
            <thead>
                <tr>
                    <th>Restaurant</th>
                    <th>Picture</th>
                    <th>Cuisine</th>
                    <th>Rating</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for r in restaurantList %}
                <tr>
                    <td>{{ r.name }}</td>
                    <td>
                        <img src="{{ r.picture }}" alt="{{ r.name }}">
                    </td>
                    <td>{{ r.cuisine }}</td>
                    <td>⭐ {{ r.rating }}</td>
                    <td>
                        <a class="view-btn" href="{% url 'view_menu' r.id username %}">
                            View Menu
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Dark / Light Toggle -->
    <button class="toggle-mode"></button>

    <script>
        const toggleBtn = document.querySelector('.toggle-mode');
        const setThemeIcon = () => {
            toggleBtn.textContent = document.body.classList.contains('dark-mode') ? '☾' : '☀';
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        setThemeIcon();

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem(
                'theme',
                document.body.classList.contains('dark-mode') ? 'dark' : 'light'
            );
            setThemeIcon();
        });
    </script>

</body>
</html>
